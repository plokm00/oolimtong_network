<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>울림통 : 공명 네트워크 - 호흡 수행</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/breath.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Cinzel:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="breath-container">
        <!-- 뒤로가기 -->
        <a href="practice.html" class="back-btn">← 돌아가기</a>

        <!-- 배경 -->
        <div class="breath-bg"></div>

        <!-- 시작 화면 -->
        <div class="breath-screen active" id="screen-intro">
            <div class="intro-content">
                <div class="breath-icon">🌬️</div>
                <h1 class="breath-title">호흡 수행</h1>
                <p class="breath-subtitle">Breath Practice</p>

                <div class="instructions">
                    <p>화면의 원을 따라 호흡하세요</p>
                    <ul>
                        <li>원이 <strong>커질 때</strong> → 들숨 (4초)</li>
                        <li>원이 <strong>멈출 때</strong> → 정지 (2초)</li>
                        <li>원이 <strong>작아질 때</strong> → 날숨 (4초)</li>
                    </ul>
                    <p class="cycles-info">3회 반복하면 수행이 완료됩니다</p>
                </div>

                <button class="start-btn" id="start-btn">수행 시작</button>
            </div>
        </div>

        <!-- 수행 화면 -->
        <div class="breath-screen" id="screen-practice">
            <div class="practice-content">
                <!-- 호흡 원 -->
                <div class="breath-circle-container">
                    <div class="breath-circle" id="breath-circle">
                        <span class="breath-text" id="breath-text">준비</span>
                    </div>
                    <div class="breath-ring"></div>
                </div>

                <!-- 진행 표시 -->
                <div class="cycle-indicator">
                    <span id="current-cycle">0</span> / <span id="total-cycles">3</span>
                </div>

                <!-- 진행 바 -->
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- 완료 화면 -->
        <div class="breath-screen" id="screen-complete">
            <div class="complete-content">
                <div class="talisman-reveal">
                    <div class="talisman-glow"></div>
                    <div class="talisman-icon">🌬️</div>
                </div>

                <h2 class="complete-title">수행 완료!</h2>
                <p class="complete-desc">호흡 부적을 획득했습니다</p>

                <div class="reward-card">
                    <div class="reward-icon">◇</div>
                    <div class="reward-name">호흡의 부적</div>
                    <div class="reward-desc">들숨과 날숨의 조화를 이룬 증표</div>
                </div>

                <button class="continue-btn" id="continue-btn">계속하기</button>
            </div>
        </div>
    </div>

    <script src="js/user.js"></script>
    <script src="js/unify.js"></script>
    <script src="js/breath.js"></script>
</body>

</html>
